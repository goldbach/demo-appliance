# systemd-sysupdate: manages A/B rootfs partition swaps.
# Run: systemd-sysupdate update
# Or trigger via your management agent / USB update flow.

[Source]
Type=url-file
# Point at your update server. For air-gap, override with a local path or
# a temporarily mounted USB at /run/update-media.
Path=https://updates.example.com/os/
MatchPattern=rootfs-@v.raw.zst

[Target]
Type=partition
# Writes to whichever of rootfs-a / rootfs-b is NOT currently booted.
Path=auto
MatchPattern=rootfs-@{other}
ReadOnly=yes
GrowPartition=no
