vmType: vz
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64

cpus: 4
memory: "8GiB"
disk: "40GiB"

# Lima installs rootless containerd + nerdctl by default — the build
# pipeline doesn't need any of it
containerd:
  system: false
  user: false

mounts:
  # Host home at the same path inside the guest, writable. Wherever the repo
  # is cloned under ~, `limactl shell` mirrors the host cwd into the guest
  # and builds write straight back to the host checkout.
  - location: "~"
    writable: true

provision:
  # make is the entry point for everything — have it ready before
  # scripts/install-build-deps.sh has run (that script installs the rest)
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      apt-get update
      apt-get install -y --no-install-recommends make
  # Subordinate id ranges for mmdebstrap --mode=unshare. Runs as the default
  # user (passwordless sudo) to avoid guessing the username from templates.
  - mode: user
    script: |
      #!/bin/bash
      set -euo pipefail
      grep -q "^$(id -un):" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$(id -un)"
      grep -q "^$(id -un):" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$(id -un)"
