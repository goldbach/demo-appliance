[Distribution]
Distribution=ubuntu
Release=resolute
Architecture=x86-64
# RepositoryFiles=local-compat.sources

[Output]
Format=tar
ImageId=mydistro-rootfs
CompressOutput=no

[Content]
WithRecommends=no

Packages=
    # Kernel
    linux-image-generic

    # Base system
    systemd
    systemd-resolved
    systemd-sysv
    systemd-timesyncd
    udev
    dbus
    ca-certificates
    apt-transport-https

    # SSH — remove once appliance is locked down
    openssh-server

    # Network
    iproute2
    iputils-ping
    iptables
    nftables
    bridge-utils
    ethtool
    dnsutils
    tcpdump
    socat
    netcat-openbsd

    # Required by k3s / kube-proxy
    conntrack
    kmod
    nfs-common
    open-iscsi

    # containerd CLI access (k3s brings its own containerd + crictl via `k3s crictl`)
    containerd

    # EFI bootloader — extracted from rootfs by make-iso.sh; grub-install runs in chroot
    grub-efi-amd64-signed
    shim-signed

    # Sysadmin
    curl
    wget
    vim
    less
    jq
    htop
    lsof
    strace
    bash-completion
    psmisc
    procps
    util-linux
    zstd

RemovePackages=
    ubuntu-advantage-tools
    unattended-upgrades
    snapd

# Drop in our units and config
ExtraTrees=../units:/usr/lib/systemd/system
# Enable installer.service for multi-user.target (equivalent to systemctl enable)
ExtraTrees=../units/installer.service:/etc/systemd/system/multi-user.target.wants/installer.service
ExtraTrees=../sysupdate:/usr/lib/systemd/system/systemd-sysupdate.d
ExtraTrees=../firstboot/firstboot.sh:/usr/lib/mydistro/firstboot.sh

# Installer scripts — live when booted from ISO, absent from installed system's PATH
ExtraTrees=../installer/install.sh:/usr/lib/mydistro/install.sh
ExtraTrees=../installer/installer-run.sh:/usr/lib/mydistro/installer-run.sh

# k3s binary — run scripts/fetch-k3s.sh before building
ExtraTrees=../vendor/k3s/bin/k3s:/usr/local/bin/k3s

# Air-gap images are NOT baked into the rootfs — too large.
# The ISO build picks them up from vendor/k3s/images/ separately.

# Custom initramfs hooks for live boot.
# ExtraTrees land AFTER linux-image-generic's postinst runs update-initramfs, so
# FinalizeScripts rebuilds the initrd once the hooks are in place.
ExtraTrees=initramfs/hooks/mydistro-live:/usr/share/initramfs-tools/hooks/mydistro-live
ExtraTrees=initramfs/scripts/live:/usr/share/initramfs-tools/scripts/live
FinalizeScripts=initramfs/finalize.sh

[Validation]
# Image signing happens in the ISO build step, not here
