[Distribution]
Distribution=ubuntu
Release=resolute

[Output]
Format=tar
ImageId=mydistro-rootfs
CompressOutput=no

[Content]
Packages=
    # Base system
    systemd
    systemd-resolved
    systemd-sysv
    systemd-timesyncd
    udev
    dbus
    ca-certificates
    apt-transport-https

    # SSH — remove once appliance is locked down
    openssh-server

    # Network
    iproute2
    iputils-ping
    iptables
    nftables
    bridge-utils
    ethtool
    dnsutils
    traceroute
    tcpdump
    socat
    netcat-openbsd

    # Required by k3s / kube-proxy
    conntrack
    kmod
    nfs-common
    open-iscsi

    # Containerd tooling (k3s brings its own containerd, these give CLI access)
    containerd
    cri-tools

    # Sysadmin
    curl
    wget
    vim
    less
    jq
    htop
    lsof
    strace
    bash-completion
    psmisc
    procps
    util-linux
    zstd

RemovePackages=
    ubuntu-advantage-tools
    unattended-upgrades
    snapd

# Drop in our units and config
ExtraTrees=../units:/usr/lib/systemd/system
ExtraTrees=../sysupdate:/usr/lib/systemd/system/systemd-sysupdate.d
ExtraTrees=../firstboot/firstboot.sh:/usr/lib/mydistro/firstboot.sh

# k3s binary — run scripts/fetch-k3s.sh before building
ExtraTrees=../vendor/k3s/bin/k3s:/usr/local/bin/k3s

# Air-gap images are NOT baked into the rootfs — too large.
# The ISO build picks them up from vendor/k3s/images/ separately.

[Validation]
# Image signing happens in the ISO build step, not here
